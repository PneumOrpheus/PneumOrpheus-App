trigger:
  branches:
    include:
      - production
      - main
      - develop

pr:
  branches:
    include:
      - production
      - main
      - develop

variables:
  agentPoolName: "PneumOrpheusPool"
  nodeVersion: "20.x"
  azureSubscriptionServiceConnection: "prod-pneumorpheus-app"
  acrName: "pneumorpheusacr"
  appServicePlanName: "pneumorpheus-plan"
  manageRoleAssignments: "true"

  keyVaultName: "PneumOrpheus"
  webAppResourceGroup: "AI-Diagnostics-Norway"
  keyVaultSupabaseUrlSecretName: "NEXT-PUBLIC-SUPABASE-URL"
  keyVaultSupabaseAnonKeySecretName: "NEXT-PUBLIC-SUPABASE-PUBLISHABLE-DEFAULT"
  keyVaultInferenceApiKeySecretName: "MODEL-INFERENCE-API-KEY"
  inferenceServerBaseUrl: "https://PneumOrpheus-Server.azurewebsites.net"

  appImageRepository: "pneumorpheus-app"

  # Optional deploy target
  webAppName: "PneumOrpheus-App"

  tag: "$(Build.SourceBranchName)-$(Build.BuildId)"

stages:
  - stage: Validate
    displayName: "Validate and Build"
    jobs:
      - job: LintBuild
        displayName: "Lint and Build Next.js"
        pool:
          name: "$(agentPoolName)"
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: "Use Node.js $(nodeVersion)"
            inputs:
              versionSpec: "$(nodeVersion)"

          - script: npm ci
            displayName: "Install dependencies"

          - script: npm run lint
            displayName: "Run ESLint"

          - script: |
              export NEXT_PUBLIC_SUPABASE_URL="https://example.supabase.co"
              export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY="placeholder-anon-key"
              npm run build
            displayName: "Build Next.js app"

  - stage: Containerize
    displayName: "Build and Push Image"
    dependsOn: Validate
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: BuildPush
        displayName: "Build and push app image"
        pool:
          name: "$(agentPoolName)"
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: "Build and push app image in ACR"
            inputs:
              azureSubscription: "$(azureSubscriptionServiceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -euo pipefail

                if [[ -z "$(acrName)" ]]; then
                  echo "acrName is required."
                  exit 1
                fi

                if [[ -z "$(keyVaultName)" ]]; then
                  echo "keyVaultName is required for container build."
                  exit 1
                fi

                if [[ -z "$(keyVaultSupabaseUrlSecretName)" || -z "$(keyVaultSupabaseAnonKeySecretName)" ]]; then
                  echo "Supabase Key Vault secret variable names are required for container build."
                  exit 1
                fi

                resolve_secret_value() {
                  local secret_name
                  for secret_name in "$@"; do
                    if [[ -z "$secret_name" ]]; then
                      continue
                    fi

                    local secret_value
                    secret_value=$(az keyvault secret show \
                      --vault-name "$(keyVaultName)" \
                      --name "$secret_name" \
                      --query value -o tsv 2>/dev/null || true)

                    if [[ -n "$secret_value" ]]; then
                      echo "$secret_value"
                      return 0
                    fi
                  done

                  return 1
                }

                supabase_url=$(az keyvault secret show \
                  --vault-name "$(keyVaultName)" \
                  --name "$(keyVaultSupabaseUrlSecretName)" \
                  --query value -o tsv)

                supabase_anon_key=$(resolve_secret_value \
                  "$(keyVaultSupabaseAnonKeySecretName)" \
                  "NEXT-PUBLIC-SUPABASE-PUBLISHABLE-DEFAULT" \
                  "NEXT-PUBLIC-SUPABASE-PUBLISHABLE-DEFAULT-KEY" \
                  "NEXT-PUBLIC-SUPABASE-ANON-KEY")

                if [[ -z "$supabase_url" || -z "$supabase_anon_key" ]]; then
                  echo "Supabase public environment values could not be resolved from Key Vault."
                  exit 1
                fi

                env_file="$(Build.SourcesDirectory)/build.env"
                trap 'rm -f "$env_file"' EXIT
                {
                  echo "NEXT_PUBLIC_SUPABASE_URL=$supabase_url"
                  echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY=$supabase_anon_key"
                  echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$supabase_anon_key"
                } > "$env_file"

                az acr build \
                  --registry "$(acrName)" \
                  --image "$(appImageRepository):$(tag)" \
                  --image "$(appImageRepository):latest" \
                  --file "$(Build.SourcesDirectory)/Dockerfile" \
                  "$(Build.SourcesDirectory)"

  - stage: Deploy
    displayName: "Deploy to Azure Web App (optional)"
    dependsOn: Containerize
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: DeployContainers
        displayName: "Deploy app container"
        pool:
          name: "$(agentPoolName)"
        steps:
          - task: AzureCLI@2
            displayName: "Pre-deploy validation"
            condition: and(succeeded(), ne(variables['webAppName'], ''))
            inputs:
              azureSubscription: "$(azureSubscriptionServiceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -euo pipefail

                if [[ -z "$(webAppResourceGroup)" ]]; then
                  echo "webAppResourceGroup is required when webAppName is set."
                  exit 1
                fi

                if [[ -z "$(keyVaultName)" ]]; then
                  echo "keyVaultName is required when webAppName is set."
                  exit 1
                fi

                if [[ -z "$(acrName)" ]]; then
                  echo "acrName is required when webAppName is set."
                  exit 1
                fi

                if [[ -z "$(appServicePlanName)" ]]; then
                  echo "appServicePlanName is required when webAppName is set."
                  exit 1
                fi

                if [[ "$(manageRoleAssignments)" != "true" && "$(manageRoleAssignments)" != "false" ]]; then
                  echo "manageRoleAssignments must be 'true' or 'false'."
                  exit 1
                fi

                if [[ -z "$(inferenceServerBaseUrl)" ]]; then
                  echo "inferenceServerBaseUrl is required when webAppName is set."
                  exit 1
                fi

                if [[ -z "$(keyVaultSupabaseUrlSecretName)" || -z "$(keyVaultSupabaseAnonKeySecretName)" ]]; then
                  echo "Key Vault secret name variables for Supabase are required."
                  exit 1
                fi

                resolve_secret_id() {
                  local secret_name
                  for secret_name in "$@"; do
                    if [[ -z "$secret_name" ]]; then
                      continue
                    fi

                    local secret_id
                    secret_id=$(az keyvault secret show \
                      --vault-name "$(keyVaultName)" \
                      --name "$secret_name" \
                      --query id -o tsv 2>/dev/null || true)

                    if [[ -n "$secret_id" ]]; then
                      echo "$secret_id"
                      return 0
                    fi
                  done

                  return 1
                }

                az keyvault secret show \
                  --vault-name "$(keyVaultName)" \
                  --name "$(keyVaultSupabaseUrlSecretName)" \
                  --query id -o tsv >/dev/null

                resolve_secret_id \
                  "$(keyVaultSupabaseAnonKeySecretName)" \
                  "NEXT-PUBLIC-SUPABASE-PUBLISHABLE-DEFAULT" \
                  "NEXT-PUBLIC-SUPABASE-PUBLISHABLE-DEFAULT-KEY" \
                  "NEXT-PUBLIC-SUPABASE-ANON-KEY" >/dev/null || {
                  echo "Unable to locate a Supabase publishable/anon key secret in Key Vault."
                  exit 1
                }

                if [[ -n "$(keyVaultInferenceApiKeySecretName)" ]]; then
                  az keyvault secret show \
                    --vault-name "$(keyVaultName)" \
                    --name "$(keyVaultInferenceApiKeySecretName)" \
                    --query id -o tsv >/dev/null
                fi

                echo "Pre-deploy validation passed."

          - task: AzureCLI@2
            displayName: "Deploy app container via managed identity"
            condition: and(succeeded(), ne(variables['webAppName'], ''))
            inputs:
              azureSubscription: "$(azureSubscriptionServiceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -euo pipefail

                acr_login_server="$(acrName).azurecr.io"
                image_name="${acr_login_server}/$(appImageRepository):$(tag)"

                if ! az webapp show --name "$(webAppName)" --resource-group "$(webAppResourceGroup)" >/dev/null 2>&1; then
                  if ! az appservice plan show --name "$(appServicePlanName)" --resource-group "$(webAppResourceGroup)" >/dev/null 2>&1; then
                    echo "Web App $(webAppName) does not exist and App Service plan $(appServicePlanName) was not found in $(webAppResourceGroup)."
                    echo "Create the plan first or run server/bootstrap infrastructure pipeline."
                    exit 1
                  fi

                  az webapp create \
                    --name "$(webAppName)" \
                    --resource-group "$(webAppResourceGroup)" \
                    --plan "$(appServicePlanName)" \
                    --container-image-name "mcr.microsoft.com/azuredocs/aci-helloworld" \
                    --output none
                fi

                az webapp identity assign \
                  --resource-group "$(webAppResourceGroup)" \
                  --name "$(webAppName)" \
                  --output none

                principal_id=$(az webapp identity show \
                  --resource-group "$(webAppResourceGroup)" \
                  --name "$(webAppName)" \
                  --query principalId -o tsv)

                if [[ -z "$principal_id" ]]; then
                  echo "Unable to resolve managed identity principalId for web app $(webAppName)."
                  exit 1
                fi

                acr_id=$(az acr show \
                  --name "$(acrName)" \
                  --resource-group "$(webAppResourceGroup)" \
                  --query id -o tsv)

                if [[ "$(manageRoleAssignments)" == "true" ]]; then
                  az role assignment create \
                    --assignee-object-id "$principal_id" \
                    --assignee-principal-type ServicePrincipal \
                    --role AcrPull \
                    --scope "$acr_id" \
                    --output none || true
                else
                  echo "Skipping role assignment management (manageRoleAssignments=false)."
                fi

                az webapp config set \
                  --resource-group "$(webAppResourceGroup)" \
                  --name "$(webAppName)" \
                  --generic-configurations '{"acrUseManagedIdentityCreds": true}' \
                  --output none

                az webapp config container set \
                  --resource-group "$(webAppResourceGroup)" \
                  --name "$(webAppName)" \
                  --container-image-name "$image_name" \
                  --container-registry-url "https://${acr_login_server}" \
                  --output none

          - task: AzureCLI@2
            displayName: "Configure main app settings from Key Vault"
            condition: and(succeeded(), ne(variables['webAppName'], ''), ne(variables['webAppResourceGroup'], ''), ne(variables['keyVaultName'], ''))
            inputs:
              azureSubscription: "$(azureSubscriptionServiceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -euo pipefail

                base_url="$(inferenceServerBaseUrl)"
                base_url="${base_url%/}"
                inference_api_url="${base_url}/infer"

                if [[ -z "$base_url" ]]; then
                  echo "inferenceServerBaseUrl is required for web app deployment."
                  exit 1
                fi

                resolve_secret_value() {
                  local secret_name
                  for secret_name in "$@"; do
                    if [[ -z "$secret_name" ]]; then
                      continue
                    fi

                    local secret_value
                    secret_value=$(az keyvault secret show \
                      --vault-name "$(keyVaultName)" \
                      --name "$secret_name" \
                      --query value -o tsv 2>/dev/null || true)

                    if [[ -n "$secret_value" ]]; then
                      echo "$secret_value"
                      return 0
                    fi
                  done

                  return 1
                }

                supabase_url=$(az keyvault secret show \
                  --vault-name "$(keyVaultName)" \
                  --name "$(keyVaultSupabaseUrlSecretName)" \
                  --query value -o tsv)

                supabase_anon_key=$(resolve_secret_value \
                  "$(keyVaultSupabaseAnonKeySecretName)" \
                  "NEXT-PUBLIC-SUPABASE-PUBLISHABLE-DEFAULT" \
                  "NEXT-PUBLIC-SUPABASE-PUBLISHABLE-DEFAULT-KEY" \
                  "NEXT-PUBLIC-SUPABASE-ANON-KEY")

                if [[ -z "$supabase_url" || -z "$supabase_anon_key" ]]; then
                  echo "Supabase public environment values could not be resolved from Key Vault."
                  exit 1
                fi

                az webapp config appsettings set \
                  --resource-group "$(webAppResourceGroup)" \
                  --name "$(webAppName)" \
                  --settings \
                    NEXT_PUBLIC_SUPABASE_URL="$supabase_url" \
                    NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY="$supabase_anon_key" \
                    NEXT_PUBLIC_SUPABASE_ANON_KEY="$supabase_anon_key" \
                    INFERENCE_API_URL="$inference_api_url" \
                    WEBSITES_PORT="3000" \
                    NODE_ENV="production" \
                  --output none

                if [[ -n "$(keyVaultInferenceApiKeySecretName)" ]]; then
                  inference_api_key=$(az keyvault secret show \
                    --vault-name "$(keyVaultName)" \
                    --name "$(keyVaultInferenceApiKeySecretName)" \
                    --query value -o tsv)

                  az webapp config appsettings set \
                    --resource-group "$(webAppResourceGroup)" \
                    --name "$(webAppName)" \
                    --settings INFERENCE_API_KEY="$inference_api_key" \
                    --output none
                fi
